services:
  packwiz:
    image: python:3.13-alpine
    command: ["python", "-m", "http.server", "8080", "--directory", "/packs"]
    restart: unless-stopped
    volumes:
      - ..:/packs:ro

  minecraft:
    image: "itzg/minecraft-server:${JAVA_IMAGE_TAG}"
    depends_on:
      - packwiz
    stdin_open: true
    tty: true
    restart: "no"
    ports:
      - "${MC_PORT}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE}"
      VERSION: "${MC_VERSION}"
      FORGE_VERSION: "${FORGE_VERSION:-}"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION:-}"
      FABRIC_LOADER_VERSION: "${FABRIC_LOADER_VERSION:-}"
      PACKWIZ_URL: "http://packwiz:8080/${PACK_DIR}/pack.toml"
      MEMORY: "${MC_MEMORY}"
      USE_AIKAR_FLAGS: "false"
      JVM_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200"
      MOTD: "Peripheral playground - ${LANE}"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      ALLOW_FLIGHT: "true"
      ENABLE_COMMAND_BLOCK: "true"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "4"
      MAX_TICK_TIME: "-1"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      LEVEL: "playground"
      LEVEL_TYPE: "minecraft:flat"
      GENERATOR_SETTINGS: '{"layers":[],"biome":"minecraft:the_void","structures":false}'
      GENERATE_STRUCTURES: "false"
      SYNC_CHUNK_WRITES: "false"
      OVERRIDE_SERVER_PROPERTIES: "true"
    volumes:
      - "./runtime/${LANE}/data:/data"
      - "./runtime/shared-cache:/downloads"
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 10m
      interval: 10s
      timeout: 5s
      retries: 12

  client:
    image: "3arthqu4ke/headlessmc:latest"
    profiles: ["client"]
    depends_on:
      packwiz:
        condition: service_started
      minecraft:
        condition: service_healthy
    command: ["/testing/bin/client-entrypoint.sh"]
    environment:
      LANE: "${LANE}"
      PACK_DIR: "${PACK_DIR}"
      MC_TYPE: "${MC_TYPE}"
      MC_VERSION: "${MC_VERSION}"
      LOADER_VERSION: "${LOADER_VERSION}"
      JAVA_IMAGE_TAG: "${JAVA_IMAGE_TAG}"
      CLIENT_MEMORY: "${CLIENT_MEMORY}"
    volumes:
      - "./bin:/testing/bin:ro"
      - "./runtime/${LANE}/client:/root:rw"
      - "./runtime/shared-cache:/cache:rw"
